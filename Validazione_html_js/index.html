<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Validazione Input</title>
    <style type="text/css">
        #JS{
            display: none;
        }
    </style>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script>
        function verificaJs(){
            document.getElementById('JS').style.display="inline";
        }
    </script>
</head>
<body onload="verificaJs()">
    <header>
        <h1>Test Form iscrizione</h1>
    </header>
    <div id="">
        <form id="formJs">
            <label id="inputLbl">
                Email:
                <input type="email" id="inputEmail"/>
            </label>
            <label id="codFiscLbl">
                Codice Fiscale:
                <input type="text" id="inputCodFiscale"/>
            </label>
            <label id="inputPIvaLbl">
                Partita IVA:
                <input type="text" id="inputPIva"/>
            </label>
            <label id="selectTipoLbl">
                Selezionare il tipo
                <select id="selectTipo"></select>
            </label>
            <label id="inputRadioLbl">
                Sesso
                <br>
                <input type="radio" id="inputRadSesso1" value="1" name="sesso">Maschio
                <br>
                <input type="radio" id="inputRadSesso2" value="2" name="sesso">Femmina
            </label>
            <label id="inputCheckboxLbl">
                Selezionare almeno 2 hobbies<br>
                <input type="checkbox" id="hobby1" name="hobby">Pesca<br>
                <input type="checkbox" id="hobby2" name="hobby">Uncinetto<br>
                <input type="checkbox" id="hobby3" name="hobby">Scacchi<br>
            </label>
            <button type="button" id="invia">Invia</button>
        </form>
    </div>
    <script src="validator.js"></script>
</body>
</html>
