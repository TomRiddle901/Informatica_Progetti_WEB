<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Validazione Input</title>
    <style type="text/css">
        #JS{
            display: none;
        }
    </style>
    <script>
        function verificaJs(){
            document.getElementById('JS').style.display="inline";
        }
    </script>
    <script src="validator.js"></script>
</head>
<body onload="verificaJs()">
    <header>
        <h1>Test Form iscrizione</h1>
    </header>
    <div id="">
        <form id="formJs">
            <p>Email: <input type="email" id="inputEmail"/></p>
            <p>Codice Fiscale: <input type="text" id="inputCodFiscale"/></p>
            <p>Partita IVA: <input type="text" id="inputPIva"/></p>
            <p>Selezionare il tipo <select id="selectTipo"></select></p>
            <p>Sesso</p>
            <input type="radio" id="inputRadSesso1" value="1" name="sesso">Maschio
            <br>
            <input type="radio" id="inputRadSesso2" value="2" name="sesso">Femmina
            <p>Selezionare almeno 2 hobbies</p>
            <input type="checkbox" id="hobby1" name="hobby">Pesca<br>
            <input type="checkbox" id="hobby2" name="hobby">Uncinetto<br>
            <input type="checkbox" id="hobby3" name="hobby">Scacchi<br>
            <button type="button" id="invia">Invia</button>
        </form>
    </div>
</body>
</html>
