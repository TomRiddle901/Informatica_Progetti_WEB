<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Validazione Input</title>
    <style type="text/css">
        #JS {
            display: none;
        }
    </style>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <header>
        <h1>Test Form iscrizione</h1>
    </header>
    <noscript>
        <div id="noJS">
            <h2>Modulo Standard (JavaScript non abilitato)</h2>
            <form method="post" id="formNoJS" action="salva.php">
                <label id="emailLbl">
                    Email: <input type="email" pattern="[^\s@]+@[^\s@]+\.[^\s@]" id="inputEmail" required/>
                </label>
                <label id="codFiscLbl">
                    Codice Fiscale: <input type="text" pattern="[A-Z]{6}[0-9]{2}[A-Z]{1}[0-9]{2}[A-Z]{1}[0-9]{3}[A-Z]{1}" id="inputCodFiscale" required/>
                </label>
                <label id="inputPIvaLbl">
                    Partita IVA: <input type="text" pattern="[0-9]{11}$" id="inputPIva" required/>
                </label>
                <label id="selectTipoLbl">
                    Selezionare il tipo
                    <select id="selectTipo" required>
                        <option value="default" disabled selected>Seleziona</option>
                        <option value="privato">Privato</option>
                        <option value="azienda">Azienda</option>
                        <option value="libProf">Libero Professionista</option>
                    </select>
                </label>
                <label id="inputRadioLbl">
                    Sesso<br>
                    <input type="radio" id="inputRadio1" name="sesso" value="1" required>Maschio<br>
                    <input type="radio" id="inputRadio2" name="sesso" value="2" required> Femmina
                </label>
                <label id="inputCheckboxLbl">
                    Selezionare almeno 2 hobbies<br>
                    <input type="checkbox" id="hobby1" name="hobby" required>Pesca<br>
                    <input type="checkbox" id="hobby2" name="hobby" required>Uncinetto<br>
                    <input type="checkbox" id="hobby3" name="hobby" required>Scacchi
                </label>
                <button type="submit" id="btnInvia">Invia</button>
            </form>
        </div>
    </noscript>

    <div id="JS">
        <form method="post" id="formJs" onsubmit="convalidaForm()" action="salva.php">
            <label id="emailLbl">
                Email:
                <input type="email" id="inputEmail"/>
            </label>
            <label id="codFiscLbl">
                Codice Fiscale:
                <input type="text" id="inputCodFiscale"/>
            </label>
            <label id="inputPIvaLbl">
                Partita IVA:
                <input type="text" id="inputPIva"/>
            </label>
            <label id="selectTipoLbl">
                Selezionare il tipo
                <select id="selectTipo">
                    <option value="default" disabled selected>Seleziona</option>
                    <option value="privato">Privato</option>
                    <option value="azienda">Azienda</option>
                    <option value="libProf">Libero Professionista</option>
                </select>
            </label>
            <label id="inputRadioLbl">
                Sesso
                <br>
                <input type="radio" id="inputRadSesso1" value="1" name="sesso">Maschio
                <br>
                <input type="radio" id="inputRadSesso2" value="2" name="sesso">Femmina
            </label>
            <label id="inputCheckboxLbl">
                Selezionare almeno 2 hobbies<br>
                <input type="checkbox" id="hobby1" name="hobby">Pesca<br>
                <input type="checkbox" id="hobby2" name="hobby">Uncinetto<br>
                <input type="checkbox" id="hobby3" name="hobby">Scacchi<br>
            </label>
            <button type="submit" id="btnInvia">Invia</button>
        </form>
    </div>
    <script src="validator.js" defer></script>
</body>
</html>
