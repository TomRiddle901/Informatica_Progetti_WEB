<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form con validazione</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <header>
        <h1>Form con validazione</h1>
    </header>

    <noscript>
        <form id="formNoJs" method="post">
            <div class="campiInput">
                <!-- Campo input testo -->
                <div class="form-group">
                    <label for="inputTestoNoJs" id="inputTestoNoJsLbl">Campo testo</label>
                    <input type="text" id="inputTestoNoJs" placeholder="Campo di testo" required>
                </div>

                <!-- Campo input numerico -->
                <div class="form-group">
                    <label for="inputNumericoNoJs" id="inputNumericoNoJsLbl">Campo numerico (0-100)</label>
                    <input type="number" id="inputNumericoNoJs" min="0" max="100" placeholder="Campo numerico (0-100)" required>
                </div>

                <!-- Campo numerico a 5 cifre massime -->
                <div class="form-group">
                    <label for="inputNumerico5CifreNoJs" id="inputNumerico5CifreNoJsLbl">Campo numerico (max 5 cifre)</label>
                    <input type="number" id="inputNumerico5CifreNoJs" min="0" max="99999" placeholder="Campo numerico (max 5 cifre)" required>
                </div>

                <!-- Campo input email -->
                <div class="form-group">
                    <label for="inputEmailNoJs" id="inputEmailNoJsLbl">Email</label>
                    <input type="email" id="inputEmailNoJs" pattern="[^\s@]+@[^\s@]+\.[^\s@]+" placeholder="Campo Email" required>
                </div>

                <!-- Select per tipologia -->
                <div class="form-group">
                <label for="selectTipologiaNoJs" id="selectTipologiaNoJsLbl">Scegli una tipologia</label>
                    <select id="selectTipologiaNoJs" required>
                        <option value="" selected disabled>Scegli un'opzione</option>
                        <option value="bonifico">Bonifico</option>
                        <option value="bonificoIstantaneo">Bonifico istantaneo</option>
                    </select>
                </div>

                <!-- Input per la data -->
                <div class="form-group">
                    <label for="selectDataNoJs" id="selectDataNoJsLbl">Scegli una data</label>
                    <input type="date" id="selectDataNoJs" required>
                </div>

                <!-- Input per l'importo -->
                <div class="form-group">
                    <label for="inputImportoNoJs" id="inputImportoNoJsLbl">Importo</label>
                    <span class="input-importo-symbol">€</span>
                    <input type="number" id="inputImportoNoJs" min="0" placeholder="0,00" required>
                </div>

                <!-- Input per la percentuale -->
                <div class="form-group">
                    <label for="inputPercentualeNoJs" id="inputPercentualeNoJsLbl">Percentuale</label>
                    <span class="input-percentuale-symbol">%</span>
                    <input type="number" id="inputPercentualeNoJs" min="0" max="100" placeholder="0" required>
                </div>

                <!-- Campo input testo aggiuntivo -->
                <div class="form-group">
                    <label for="inputTestoAggiuntivoNoJs" id="inputTestoAggiuntivoNoJsLbl">Testo aggiuntivo</label>
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
                    </svg>
                    <input type="text" id="inputTestoAggiuntivoNoJs" placeholder="Lorem Ipsum" required>
                </div>
            </div>

            <h2>Autocomplete</h2>
            <div class="form-group full-width">
                <!-- Input comune di residenza -->
                <label for="inputComuneResidenzaNoJs" id="inputComuneResidenzaNoJsLbl">Comune di residenza</label>
                <input type="text" id="inputComuneResidenzaNoJs" placeholder="Comune di residenza" required>
            </div>

            <h2>Checkbox/Radio</h2>
            <div class="control-row">
                <!-- Checkbox isolata -->
                <div class="control-item">
                    <input type="checkbox" id="checkboxIsolataNoJs">
                    <label for="checkboxIsolataNoJs" id="checkboxIsolataNoJsLbl">Checkbox isolata</label>
                </div>

                <!-- Toggle Isolato -->
                <div class="control-item">
                    <input type="checkbox" id="toggleIsolatoNoJs">
                    <label for="toggleIsolatoNoJs" id="toggleIsolatoNoJsLbl">Toggle Isolato</label>
                </div>
            </div>

            <!-- Fieldset campi radio -->
            <fieldset>
                <legend>Fieldset radio buttons</legend>
               <div class="control-row">
                   <div class="control-item">
                       <input type="radio" id="radio1NoJs" name="radio" required>
                       <label for="radio1NoJs" id="radio1NoJsLbl">Radio 1</label>
                   </div>
                   <div class="control-item">
                       <input type="radio" id="radio2NoJs" name="radio">
                       <label for="radio2NoJs" id="radio2NoJsLbl">Radio 2</label>
                   </div>
               </div>
            </fieldset>

            <!-- Fieldset campi checkbox -->
            <fieldset>
                <legend>Fieldset checkbox</legend>
                <div class="control-row">
                    <div class="control-item">
                        <input type="checkbox" id="checkbox1NoJs" name="checkbox">
                        <label for="checkbox1NoJs" id="checkbox1NoJsLbl">Checkbox 1</label>
                    </div>
                    <div class="control-item">
                        <input type="checkbox" id="checkbox2NoJs" name="checkbox">
                        <label for="checkbox2NoJs" id="checkbox2NoJsLbl">Checkbox 2</label>
                    </div>
                </div>
            </fieldset>

            <h2>File</h2>
            <div class="campiInput">
                <!-- Campo upload file -->
                <div class="form-group">
                    <label for="inputFileNoJs" id="inputFileNoJsLbl">Scegli un file</label>
                    <input type="file" id="inputFileNoJs" required>
                </div>

                <!-- Bottone upload immagine -->
                <div class="form-group">
                    <label for="inputImmagineNoJs" id="inputImmagineNoJsLbl">Upload custom (solo jpg/png)</label>
                    <input type="file" id="inputImmagineNoJs" accept=".jpeg, .jpg, .png" required>
                </div>
            </div>

            <!-- Bottone per inviare il form -->
            <button type="submit" id="inviaFormNoJs">Invia form</button>
        </form>
    </noscript>

    <div class="formJs">
        <form id="formJs" method="post">
            <div class="campiInput">
                <!-- Campo input testo -->
                <div class="form-group">
                    <label for="inputTesto" id="inputTestoLbl">Campo Testo</label>
                    <input type="text" id="inputTesto" placeholder="Campo di testo">
                </div>

                <!-- Campo input numerico -->
                <div class="campiInput">
                    <label for="inputNumerico" id="inputNumericoLbl">Campo numerico (0 - 100)</label>
                    <input type="number" id="inputNumerico" min="0" max="100" placeholder="Campo numerico (0 - 100)">
                </div>
            </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
