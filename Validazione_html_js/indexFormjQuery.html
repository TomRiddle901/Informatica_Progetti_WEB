<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Validazione Input + jQuery & Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="jQueryCss.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <header class="mb-4 text-center">
            <h1 class="h1">Validazione Input con jQuery</h1>
        </header>

        <!-- Sezione dove appare il form quando il JavaScript è  disabilitato-->
        <noscript id="noJS">
            <div class="card card-body mb-4 border-warning">
                <h2 class="h2 text-warning">Validazione dati (JavaScript disabilitato)</h2>
                <form method="post" id="formNoJs" action="salva.php">
                    <!-- Casella di Input per l'Email -->
                    <div class="mb-3">
                        <label for="inputEmailNoJs" id="inputEmailNoJsLbl" class="form-label">Email:</label>
                        <input type="email" pattern="[^\s@]+@[^\s@]+\.[^\s@]+" id="inputEmailNoJs" class="form-control" required>
                    </div>

                    <!-- Casella di Input per il Codice Fiscale -->
                    <div class="mb-3">
                        <label for="inputCodFiscNoJs" id="inputCodiceFiscNoJsLbl" class="form-label">Codice Fiscale:</label>
                        <input type="text" pattern="[A-Za-z]{6}[0-9]{2}[A-Za-z]{1}[0-9]{2}[A-Za-z]{1}[0-9]{3}[A-Za-z]{1}" id="inputCodFiscNoJs" class="form-control" required>
                    </div>

                    <!-- Casella di Input per la Partita IVA -->
                    <div class="mb-3">
                        <label for="inputPIvaNoJs" id="inputPIvaNoJsLbl" class="form-label">Partita Iva:</label>
                        <input type="text" pattern="[0-9]{11}" id="inputPIvaNoJs" class="form-control" required>
                    </div>

                    <!-- Select per la tipologia -->
                    <div class="mb-3">
                        <label for="selectTipoNoJs" id="selectTipoNoJsLbl" class="form-label">Tipologia:</label>
                        <select id="selectTipoNoJs" class="form-select" required>
                            <option value="" selected disabled>Seleziona il tipo</option>
                            <option value="privato">Privato</option>
                            <option value="azienda">Azienda</option>
                            <option value="libProf">Libero Professionista</option>
                        </select>
                    </div>

                    <!-- Input Radio per il Sesso -->
                    <div class="mb-3">
                        <label id="inputSessoNoJsLbl" class="form-label d-block">Sesso:</label>
                            <div class="form-check form-check-inline">
                                <input type="radio" name="sesso" value="1" id="inputMaschioRadio" class="form-check-input" required>
                                <label class="form-check-label" for="inputMaschioRadio">Maschio</label>
                            </div>
                        <div class="form-check form-check-inline">
                            <input type="radio" name="sesso" value="2" id="inputFemminaRadio" class="form-check-input">
                            <label class="form-check-label" for="inputFemminaRadio">Femmina</label>
                        </div>
                    </div>

                    <!-- Checkbox per selezionare gli hobby -->
                    <div class="mb-3">
                        <label id="inputHobbyNoJsLbl" class="form-label d-block">Seleziona almeno 2 hobby:</label>
                        <div class="form-check">
                            <input type="checkbox" id="hobby1" class="form-check-input" name="hobby">
                            <label class="form-check-label" for="hobby1">Pesca</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" id="hobby2" class="form-check-input" name="hobby">
                            <label class="form-check-label" for="hobby2">Scacchi</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" id="hobby3" class="form-check-input" name="hobby">
                            <label class="form-check-label" for="hobby3">Uncunetto</label>
                        </div>
                    </div>

                    <button type="submit" id="inviaFormNoJs" class="btn btn-warning">Invia Modulo</button>
                 </form>
            </div>
        </noscript>

    <!-- Form visualizzato quando viene caricato lo script JS -->
        <div id="JS" class="card card-body shadow-sm">
            <form method="post" id="formJs">
                <!-- Casella di Input per l'Email -->
                <div class="mb-3">
                    <label for="inputEmail" id="inputEmailLbl" class="form-label">Email:</label>
                    <input type="email" id="inputEmail" class="form-control">
                    <div class="invalid-feedback" id="erroreInputEmail"></div>
                </div>

                <!-- Casella di Input per la Partita IVA -->
                <div class="mb-3">
                    <label for="inputPIva" id="inputPIvaLbl" class="form-label">Partita Iva:</label>
                    <input type="text" id="inputPIva" class="form-control">
                    <div class="invalid-feedback" id="erroreInputPIva"></div>
                </div>

                <!-- Casella di Input per il Codice Fiscale -->
                <div class="mb-3">
                    <label for="inputCodFisc" id="inputCodFiscLbl" class="form-label">Codice Fiscale:</label>
                    <input type="text" id="inputCodFisc" class="form-control">
                    <div class="invalid-feedback" id="erroreInputCodFisc"></div>
                </div>

                <!-- Select per la tipologia -->
                <div class="mb-3">
                    <label for="selectTipo" id="selectTipoLbl" class="form-label">Tipologia:</label>
                    <select id="selectTipo" class="form-select">
                        <option value="" selected disabled>Seleziona il tipo</option>
                        <option value="privato">Privato</option>
                        <option value="azienda">Azienda</option>
                        <option value="libProf">Libero Professionista</option>
                    </select>
                    <div class="invalid-feedback" id="erroreSelectTipo"></div>
                </div>

                <!-- Input Radio per il Sesso -->
                <div class="mb-3">
                    <label class="form-label d-block" id="inputSessoLbl">Sesso</label>
                    <div class="form-check form-check-inline">
                        <input type="radio" id="inputMaschio" class="form-check-input" name="inputSesso" value="1">
                        <label for="inputMaschio" class="form-check-label">Maschio</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input type="radio" id="inputFemmina" class="form-check-input" name="inputSesso" value="2">
                        <label for="inputFemmina" class="form-check-label">Femmina</label>
                    </div>
                    <div class="invalid-feedback" id="erroreInputSesso"></div>
                </div>

                <!-- Checkbox per selezionare gli hobby -->
                <div class="mb-3">
                    <label id="inputHobbyLbl" class="form-label d-block">Seleziona almeno 2 hobby:</label>
                    <div class="form-check">
                        <input type="checkbox" id="inputHobby1" class="form-check-input" name="hobby">
                        <label for="inputHobby1" class="form-check-label">Pesca</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="inputHobby2" class="form-check-input" name="hobby">
                    <label for="inputHobby2" class="form-check-label">Scacchi</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="inputHobby3" class="form-check-input" name="hobby">
                        <label for="inputHobby3" class="form-check-label">Uncinetto</label>
                    </div>
                    <div class="invalid-feedback" id="erroreInputHobby"></div>
                </div>

                <div id="erroriPresentiForm" class="text-danger mb-3 fw-bold"></div>

                <button type="submit" id="inviaFormBtn" class="btn btn-primary">Invia Modulo</button>
            </form>
        </div>
    </div>

    <!-- Implementazione della libreria jQuery e dello script JavaScript -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script src="scriptFormjQuery.js"></script>
</body>
</html>
