<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Validazione Input + jQuery & Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="jQueryCss.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <header class="mb-4 text-center">
            <h1 class="h1">Validazione Input con jQuery</h1>
        </header>

        <!-- Sezione dove appare il form quando il JavaScript è  disabilitato-->
        <noscript id="noJS">
            <div class="card card-body mb-4 border-warning">
                <h2 class="h2 text-warning">Validazione dati (JavaScript disabilitato)</h2>
                <form method="post" id="formNoJs" action="salva.php">
                    <!-- Casella di Input per l'Email -->
                    <div class="mb-3">
                        <label for="inputEmailNoJs" id="inputEmailNoJsLbl" class="form-label">Email:</label>
                        <input type="email" pattern="[^\s@]+@[^\s@]+\.[^\s@]+" id="inputEmailNoJs" class="form-control" required>
                    </div>

                    <!-- Casella di Input per il Codice Fiscale -->
                    <div class="mb-3">
                        <label for="inputCodFiscNoJs" id="inputCodiceFiscNoJsLbl" class="form-label">Codice Fiscale:</label>
                        <input type="text" pattern="[A-Za-z]{6}[0-9]{2}[A-Za-z]{1}[0-9]{2}[A-Za-z]{1}[0-9]{3}[A-Za-z]{1}" id="inputCodFiscNoJs" class="form-control" required>
                    </div>

                    <!-- Casella di Input per la Partita IVA -->
                    <div class="mb-3">
                        <label for="inputPIvaNoJs" id="inputPIvaNoJsLbl" class="form-label">Partita Iva:</label>
                        <input type="text" pattern="[0-9]{11}" id="inputPIvaNoJs" class="form-control" required>
                    </div>

                    <!-- Select per la tipologia -->
                    <div class="mb-3">
                        <label for="selectTipoNoJs" id="selectTipoNoJsLbl" class="form-label">Tipologia:</label>
                        <select id="selectTipoNoJs" class="form-select" required>
                            <option value="" selected disabled>Seleziona il tipo</option>
                            <option value="privato">Privato</option>
                            <option value="azienda">Azienda</option>
                            <option value="libProf">Libero Professionista</option>
                        </select>
                    </div>

                    <!-- Input Radio per il Sesso -->
                    <div class="mb-3">
                        <label id="inputSessoNoJsLbl" class="form-label d-block">Sesso:</label>
                            <div class="form-check form-check-inline">
                                <input type="radio" name="sesso" value="1" id="inputMaschioRadio" class="form-check-input" required>
                                <label class="form-check-label" for="inputMaschioRadio">Maschio</label>
                            </div>
                        <div class="form-check form-check-inline">
                            <input type="radio" name="sesso" value="2" id="inputFemminaRadio" class="form-check-input">
                            <label class="form-check-label" for="inputFemminaRadio">Femmina</label>
                        </div>
                    </div>

                    <!-- Checkbox per selezionare gli hobby -->
                    <div class="mb-3">
                        <label id="inputHobbyNoJsLbl" class="form-label d-block">Seleziona almeno 2 hobby:</label>
                        <div class="form-check">
                            <input type="checkbox" id="hobby1" class="form-check-input" name="hobby">
                            <label class="form-check-label" for="hobby1">Pesca</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" id="hobby2" class="form-check-input" name="hobby">
                            <label class="form-check-label" for="hobby2">Scacchi</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" id="hobby3" class="form-check-input" name="hobby">
                            <label class="form-check-label" for="hobby3">Uncunetto</label>
                        </div>
                    </div>

                    <button type="submit" id="inviaFormNoJs">Invia Modulo</button>
                 </form>
            </div>
        </noscript>

    <div id="JS">
        <form method="post" id="formJs">
            <label id="inputEmailLbl">
                Email: <input type="email" id="inputEmail">
                <span id="erroreInputEmail"></span>
            </label>
            <label id="inputPIvaLbl">
                Partita Iva: <input type="text" id="inputPIva">
                <span id="erroreInputPIva"></span>
            </label>
            <label id="inputCodFiscLbl">
                Codice Fiscale: <input type="text" id="inputCodFisc">
                <span id="erroreInputCodFisc"></span>
            </label>
            <label id="selectTipoLbl">
                Seleziona un tipo
                <select id="selectTipo">
                    <option value="" selected disabled>Seleziona il tipo</option>
                    <option value="privato">Privato</option>
                    <option value="azienda">Azienda</option>
                    <option value="libProf">Libero Professionista</option>
                </select>
                <span id="erroreSelectTipo"></span>
            </label>
            <label id="inputSessoLbl">
                Sesso<br>
                <input type="radio" id="inputMaschio" name="inputSesso" value="1">Maschio<br>
                <input type="radio" id="inputFemmina" name="inputSesso" value="2">Femmina
                <span id="erroreInputSesso"></span>
            </label>
            <label id="inputHobbyLbl">
                Seleziona almeno 2 hobby:<br>
                <input type="checkbox" id="inputHobby1" name="hobby">Pesca<br>
                <input type="checkbox" id="inputHobby2" name="hobby">Scacchi<br>
                <input type="checkbox" id="inputHobby3" name="hobby">Uncinetto
                <span id="erroreInputHobby"></span>
            </label>

            <span id="erroriPresentiForm"></span>
            <button type="submit" id="inviaFormBtn">Invia Modulo</button>
        </form>
    </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script src="scriptFormjQuery.js"></script>
</body>
</html>
