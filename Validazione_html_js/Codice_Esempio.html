<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Dog Object</title>

    <style type="text/css">
        #JS{
            display: none;
        }
    </style>

    <script src="Validator_Esempio.js"></script>
    <script>
        function checkJs(){
            document.getElementById('JS').style.display="inline";
        }
    </script>
</head>
<body onload="checkJs()">
    <h1>Dog Object Creator</h1>
    <div id="JS">
        <form method="post" action="lab.php" onsubmit="return validate_input(this)">
            <h2>JavaScript Attivo</h2>
            <h2>Please complete all fields. Please note the required format of information.</h2>
            Your Dog's name (max 20 characters, alphabetic)
            <input type="text" pattern="[a-zA-Z]*" title="Up to 20 Alphabetic characters" maxlength="20" name="dog_name" id="dog_name" /><br>
            Your Dog's Breed (max 35 characters, alphabetic)
            <input type="text" pattern="[a-zA-Z]*" title="Up to 35 Alphabetic characters" maxlength="35" name="dog_breed" id="dog_breed" /><br>
            Your Dog's Color (max 15 characters, alphabetic)
            <input type="text" pattern="[a-zA-Z]*" title="Up to 15 Alphabetic characters" maxlength="15" name="dog_color" id="dog_color" /><br>
            Your Dog's Weight (numeric only)
            <input type="number" min="1" max="120" name="dog_weight" id="dog_weight" /><br>
            <input type="submit" value="Click to create your dog" />
        </form>
    </div>
    <noscript>
        <form method="post" action="lab.php">
            <h2>JavaScipt non attivo!</h2>

            Your Dog's Breed (max 35 characters, alphabetic)
            <input type="text" pattern="[a-zA-Z]*" title="Up to 35 Alphabetic characters" maxlength="35" name="dog_breed" id="dog_breed" /><br>
            Your Dog's Color (max 15 characters, alphabetic)
            <input type="text" pattern="[a-zA-Z]*" title="Up to 15 Alphabetic characters" maxlength="15" name="dog_color" id="dog_color" /><br>
            Your Dog's Weight (numeric only)
            <input type="number" min="1" max="120" name="dog_weight" id="dog_weight" /><br>
            <input type="submit" value="Click to create your dog" />
        </form>
    </noscript>
</body>
</html>
